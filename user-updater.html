<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q8 - User Updater</title>
  <style>
    body{font-family:Arial;margin:20px;background:#f7fbff}
    form{background:#fff;padding:12px;border-radius:8px;max-width:420px}
    input{width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ddd}
    pre{background:#f0f4f8;padding:8px;border-radius:6px;margin-top:12px}
  </style>
</head>
<body>
  <h1>Q8 — Dynamic Object Updater</h1>

  <form id="userForm">
    <label>Name<input id="uname" /></label>
    <label>Email<input id="uemail" /></label>
    <label>Age<input id="uage" type="number" /></label>
    <button type="submit">Update</button>
  </form>

  <pre id="out"></pre>

  <script>
    // initial object
    let user = { name: "John", email: "john@mail.com", age: 21 };

    const out = document.getElementById('out');
    const uname = document.getElementById('uname');
    const uemail = document.getElementById('uemail');
    const uage = document.getElementById('uage');

    function renderUser(){
      out.textContent = JSON.stringify(user, null, 2);
      uname.value = user.name;
      uemail.value = user.email;
      uage.value = user.age;
    }

    // Update on form submit
    document.getElementById('userForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      user.name = uname.value.trim();
      user.email = uemail.value.trim();
      user.age = Number(uage.value);
      renderUser();
    });

    // Live update (fixed)
    uname.addEventListener('input', () => {
      user.name = uname.value;
      renderUser();
    });

    uemail.addEventListener('input', () => {
      user.email = uemail.value;
      renderUser();
    });

    uage.addEventListener('input', () => {
      if (uage.value !== "") user.age = Number(uage.value);
      renderUser();
    });

    renderUser();
  </script>
</body>
</html>

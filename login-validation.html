<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q7 - Login Validation</title>
  <style>
    body{font-family:Arial;margin:20px;background:#fbfdff}
    form{max-width:420px;background:#fff;padding:12px;border-radius:8px}
    input{width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ccc}
    .error{color:#c0392b;font-size:13px}
    .success{color:#27ae60}
    button{margin-top:10px;padding:8px 10px}
  </style>
</head>
<body>
  <h1>Q7 — Login Form Validation</h1>
  <form id="loginForm" novalidate>
    <label>Username<input id="username" /></label>
    <div id="uErr" class="error"></div>
    <label>Password<input id="pwd" type="password" /></label>
    <div id="pErr" class="error"></div>
    <button type="submit">Login</button>
    <div id="result" style="margin-top:10px"></div>
  </form>

  <script>
    const usernameRE = /^.{5,}$/; // at least 5 characters
    const passwordRE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/; // >=8 chars with upper,lower,number,special

    const u = document.getElementById('username');
    const p = document.getElementById('pwd');
    const uErr = document.getElementById('uErr');
    const pErr = document.getElementById('pErr');
    const result = document.getElementById('result');

    document.getElementById('loginForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      let ok = true;
      uErr.textContent = ''; pErr.textContent = ''; result.textContent = '';

      if(!usernameRE.test(u.value)){ uErr.textContent = 'Username must be at least 5 characters'; ok=false; }
      if(!passwordRE.test(p.value)){
        pErr.textContent = 'Password must be at least 8 chars and include number, uppercase, lowercase and special char';
        ok=false;
      }
      if(ok){
        result.textContent = 'Login successful!';
        result.className = 'success';
      } else {
        result.textContent = 'Validation failed — see errors above.';
        result.className = '';
      }
    });
  </script>
</body>
</html>
